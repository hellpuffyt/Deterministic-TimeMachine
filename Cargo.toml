[package]
name = "deterministic-timemachine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Make flaky tests reproducible: inject clocks, randomness, filesystem, environment and network; record them to a trace; replay with precise divergence diagnostics; minimize failing traces"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hellpuffyt/Deterministic-TimeMachine"
readme = "README.md"
keywords = ["testing", "flaky-tests", "record-replay", "determinism", "delta-debugging"]
categories = ["development-tools::testing", "simulation"]
exclude = ["/.github", "/docs"]

[lib]
name = "timemachine"

[[bin]]
name = "tm"
path = "src/bin/tm/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
## The `tm` command-line tool. Library users can opt out with `default-features = false`.
cli = ["dep:clap", "dep:anyhow"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
