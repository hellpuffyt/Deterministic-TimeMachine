name: Bug report
description: Something behaves differently from the documented rules, or crashes.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command and output.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproducer
      description: A trace file (`.tmtrace`) plus the smallest program that replays it is ideal.
      render: text
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead (e.g. replay reproduces the failure, or reports a divergence)?
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, CPU, `rustc -V`, Deterministic-TimeMachine version or commit.
    validations: { required: true }
